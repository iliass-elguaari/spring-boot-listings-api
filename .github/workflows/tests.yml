name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      # The tests use an in-memory H2 database, so no Postgres service is needed.
      - run: ./mvnw -B test
