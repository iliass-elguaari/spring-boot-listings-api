name: Deploy front end demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["src/main/resources/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy run as separate jobs so the artifact is fully
  # registered before deploy-pages looks it up. In a single job the
  # lookup can run milliseconds after the upload and miss it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/main/resources/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
