spring.application.name=listings

# Connection settings come from environment variables so real credentials
# never live in the repo. The defaults match a local Postgres install.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nextroom_practice}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
